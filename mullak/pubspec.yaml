name: mullak
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  image_picker: ^1.2.1

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_data_connect: ^0.4.1
  cloud_firestore: ^7.2.0
  firebase_storage: ^14.1.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#EFE4D1"
  adaptive_icon_foreground: "assets/images/app_icon.png"