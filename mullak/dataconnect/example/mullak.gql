# ============================================================
# Mullak — queries + mutations
# @auth(level: USER) = only signed-in users can call it.
# "auth.uid" = the UID of whoever is signed in.
# ============================================================


# ---------------- AUTH / ACCOUNT ----------------

mutation UpsertUser(
  $fullName: String!
  $phoneNumber: String!
  $bOwnerFlag: Boolean!
  $pOwnerFlag: Boolean!
) @auth(level: USER) {
  user_upsert(data: {
    id_expr: "auth.uid"
    fullName: $fullName
    phoneNumber: $phoneNumber
    phoneVerified: false
    bOwnerFlag: $bOwnerFlag
    pOwnerFlag: $pOwnerFlag
  })
}

query GetMyProfile @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    fullName
    phoneNumber
    bOwnerFlag
    pOwnerFlag
  }
}

mutation UpdateMyName($fullName: String!) @auth(level: USER) {
  user_update(key: { id_expr: "auth.uid" }, data: { fullName: $fullName })
}

mutation CreateReport($description: String!, $reportType: String!) @auth(level: USER) {
  report_insert(data: {
    userId_expr: "auth.uid"
    description: $description
    reportType: $reportType
  })
}

mutation CreateReview($rating: Int!, $comment: String) @auth(level: USER) {
  review_insert(data: {
    reviewerId_expr: "auth.uid"
    rating: $rating
    comment: $comment
  })
}


# ---------------- PROPERTIES ----------------

mutation CreateProperty(
  $title: String!
  $district: String!
  $city: String!
  $propertyType: String!
  $activityType: String
  $areaSqm: Float!
  $rentPrice: Float!
  $latitude: Float!
  $longitude: Float!
  $estimatedPrice: Float
  $address: String
  $description: String
  $hasParking: Boolean
) @auth(level: USER) {
  property_insert(data: {
    ownerId_expr: "auth.uid"
    title: $title
    district: $district
    city: $city
    propertyType: $propertyType
    activityType: $activityType
    areaSqm: $areaSqm
    rentPrice: $rentPrice
    latitude: $latitude
    longitude: $longitude
    estimatedPrice: $estimatedPrice
    address: $address
    description: $description
    hasParking: $hasParking
  })
}

mutation UpdateMyProperty(
  $id: UUID!
  $title: String!
  $district: String!
  $propertyType: String!
  $activityType: String
  $areaSqm: Float!
  $rentPrice: Float!
  $latitude: Float!
  $longitude: Float!
  $estimatedPrice: Float
  $address: String
  $description: String
  $hasParking: Boolean
) @auth(level: USER) {
  property_updateMany(
    where: { id: { eq: $id }, ownerId: { eq_expr: "auth.uid" } }
    data: {
      title: $title
      district: $district
      propertyType: $propertyType
      activityType: $activityType
      areaSqm: $areaSqm
      rentPrice: $rentPrice
      latitude: $latitude
      longitude: $longitude
      estimatedPrice: $estimatedPrice
      address: $address
      description: $description
      hasParking: $hasParking
    }
  )
}

mutation UpdateMyPropertyStatus($id: UUID!, $status: String!) @auth(level: USER) {
  property_updateMany(
    where: { id: { eq: $id }, ownerId: { eq_expr: "auth.uid" } }
    data: { status: $status }
  )
}

mutation AddPropertyImage($propertyId: UUID!, $imageUrl: String!, $displayOrder: Int!) @auth(level: USER) {
  image_insert(data: {
    propertyId: $propertyId
    imageUrl: $imageUrl
    displayOrder: $displayOrder
  })
}

mutation DeleteMyPropertyImages($propertyId: UUID!) @auth(level: USER) {
  image_deleteMany(
    where: {
      propertyId: { eq: $propertyId }
      property: { ownerId: { eq_expr: "auth.uid" } }
    }
  )
}

mutation DeleteMyProperty($id: UUID!) @auth(level: USER) {
  property_deleteMany(
    where: { id: { eq: $id }, ownerId: { eq_expr: "auth.uid" } }
  )
}

query ListAvailableProperties @auth(level: USER) {
  properties(where: { status: { eq: "available" } }, orderBy: [{ rentPrice: ASC }]) {
    id
    title
    district
    city
    propertyType
    areaSqm
    rentPrice
    latitude
    longitude
    address
    coverImage: images_on_property(orderBy: [{ displayOrder: ASC }], limit: 1) { imageUrl }
  }
}

query ListMyProperties @auth(level: USER) {
  properties(where: { ownerId: { eq_expr: "auth.uid" } }) {
    id
    title
    status
    rentPrice
    areaSqm
    address
    myCoverImage: images_on_property(orderBy: [{ displayOrder: ASC }], limit: 1) { imageUrl }
  }
}

query GetProperty($id: UUID!) @auth(level: USER) {
  property(id: $id) {
    id
    title
    district
    city
    propertyType
    activityType
    areaSqm
    rentPrice
    status
    latitude
    longitude
    estimatedPrice
    address
    description
    hasParking
    owner { id fullName }
    images: images_on_property(orderBy: [{ displayOrder: ASC }]) { imageUrl displayOrder }
  }
}


# ---------------- CHAT ----------------

mutation StartChat($propertyOwnerId: String!) @auth(level: USER) {
  chat_insert(data: {
    businessOwnerId_expr: "auth.uid"
    propertyOwnerId: $propertyOwnerId
  })
}

query ListMyChats @auth(level: USER) {
  chats(where: { _or: [
    { businessOwnerId: { eq_expr: "auth.uid" } }
    { propertyOwnerId: { eq_expr: "auth.uid" } }
  ] }) {
    id
    businessOwner { id fullName }
    propertyOwner { id fullName }
  }
}

mutation SendMessage($chatId: UUID!, $content: String!) @auth(level: USER) {
  message_insert(data: {
    chatId: $chatId
    senderId_expr: "auth.uid"
    content: $content
  })
}

query ListMessages($chatId: UUID!) @auth(level: USER) {
  messages(where: { chatId: { eq: $chatId } }, orderBy: [{ sentAt: ASC }]) {
    id
    content
    isRead
    sentAt
    sender { id fullName }
  }
}

# ---------------- SAVED PROPERTIES ----------------
# "saves" (Business Owner 0..* -- 0..* Property) is stored as a list of
# property ids on the user's own row: users.savedPropertyIds.

mutation SaveProperty($propertyId: UUID!) @auth(level: USER) {
  user_update(key: { id_expr: "auth.uid" }, data: {
    savedPropertyIds_update: { add: [$propertyId] }   # add = no duplicates
  })
}

mutation UnsaveProperty($propertyId: UUID!) @auth(level: USER) {
  user_update(key: { id_expr: "auth.uid" }, data: {
    savedPropertyIds_update: { remove: [$propertyId] }
  })
}

query GetMySavedPropertyIds @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    savedPropertyIds
  }
}


# ---------------- PROPERTY DISCOVERY  ----------------
# Full property data (all photos + description + parking) for Explore,
# Details, Saved, Compare and Recommendations.

query ListDiscoveryProperties @auth(level: USER) {
  properties(where: { status: { eq: "available" } }) {
    id
    title
    district
    city
    propertyType
    activityType
    areaSqm
    rentPrice
    status
    latitude
    longitude
    estimatedPrice
    address
    description
    hasParking
    owner { id }
    images: images_on_property(orderBy: [{ displayOrder: ASC }]) { imageUrl }
  }
}

query ListPropertiesByIds($ids: [UUID!]!) @auth(level: USER) {
  properties(where: { id: { in: $ids } }) {
    id
    title
    district
    city
    propertyType
    activityType
    areaSqm
    rentPrice
    status
    latitude
    longitude
    estimatedPrice
    address
    description
    hasParking
    owner { id }
    images: images_on_property(orderBy: [{ displayOrder: ASC }]) { imageUrl }
  }
}


# ---------------- REQUIREMENTS + RECOMMENDATIONS ----------------

mutation CreateBusinessRequirement(
  $businessType: String!
  $propertyType: String!
  $budget: Float!
  $requiredSpace: Float!
  $preferredLocation: String
) @auth(level: USER) {
  businessRequirement_insert(data: {
    businessOwnerId_expr: "auth.uid"
    businessType: $businessType
    propertyType: $propertyType
    budget: $budget
    requiredSpace: $requiredSpace
    preferredLocation: $preferredLocation
  })
}

mutation CreateRecommendation(
  $requirementId: UUID!
  $propertyId: UUID!
  $locationScore: Float!
  $propertyMatchScore: Float!
  $explanation: String!
  $rank: Int!
) @auth(level: USER) {
  recommendation_insert(data: {
    requirementId: $requirementId
    propertyId: $propertyId
    locationScore: $locationScore
    propertyMatchScore: $propertyMatchScore
    explanation: $explanation
    rank: $rank
  })
}